# score-table.csv columns for market-16 contract version 1. one selection trajectory; id must be unique.
market: market-16
contractVersion: 1
unit: one selection trajectory
columns:
  case_id:
    type: str
    description: Trajectory id
  mechanism:
    type: str
    description: ''
