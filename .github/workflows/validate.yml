name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Fails if market-outcomes/ differ from what the validator computes,
      # or if a submitted file sets an outcome field.
      - run: python -m validator check
      - run: python -m validator test
      # The site must still build from the export (pages.yml deploys it from main).
      - run: python -m validator export
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
